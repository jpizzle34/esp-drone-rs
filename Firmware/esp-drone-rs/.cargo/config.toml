[build]
target = "xtensa-esp32-espidf"
# Sources ~/export-esp.sh before rustc, so the linker sees the Xtensa GCC.
rustc-wrapper = "scripts/esp-env.sh"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
# Sources ~/export-esp.sh before espflash on `cargo run`.
runner = "scripts/esp-env.sh espflash flash --monitor"
rustflags = [ "--cfg",  "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32"
ESP_IDF_VERSION = "v5.5.3"
ESP_IDF_TOOLS_INSTALL_DIR = "workspace"
ESP_IDF_SDKCONFIG_DEFAULTS = { value = "sdkconfig.defaults", relative = true }
